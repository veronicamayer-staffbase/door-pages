<!DOCTYPE html>
<html lang="en">
<head>
<!-- Staffbase brand color via ?brand= URL param -->
<script>(function(){try{var b=new URLSearchParams(location.search).get('brand');if(b&&/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(b)){document.documentElement.style.setProperty('--sb-brand',b);}}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Menu Sub-Pages</title>
<style>
:root {
    --primary: var(--sb-brand, #2563eb);
    --text: #1f2937;
    --text-light: #6b7280;
    --bg: #ffffff;
    --bg-gray: #f9fafb;
    --border: #e5e7eb;
    --radius-card: 14px;
    --shadow-card: 0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.06);
}
@media (prefers-color-scheme: dark) {
    :root {
        --primary: var(--sb-brand, #3b9eff);
        --text: #f3f4f6;
        --text-light: #9ca3af;
        --bg: #1f2937;
        --bg-gray: #111827;
        --border: #374151;
    }
}
* { box-sizing: border-box; }
html, body { background: transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
}
.cw-widget { width: 100%; padding: 16px; }

/* Tile grid — responsive reordering via column count collapse */
.cw-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (max-width: 480px) { .cw-grid { grid-template-columns: 1fr; } }

.cw-tile {
    display: flex; flex-direction: column; gap: 8px;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-card);
    padding: 18px; box-shadow: var(--shadow-card);
    text-decoration: none; color: inherit;
}
.cw-tile:hover { box-shadow: 0 2px 8px rgba(15,23,42,.10), 0 1px 3px rgba(15,23,42,.08); }
.cw-tile:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.cw-tile-title {
    margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.35; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.cw-tile-teaser {
    margin: 0; font-size: 0.88rem; line-height: 1.5; color: var(--text-light); flex: 1;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.cw-tile-cta {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.86rem; font-weight: 700; color: var(--primary); margin-top: 2px;
}
.cw-tile-cta svg { width: 13px; height: 13px; transition: transform .15s; }
.cw-tile:hover .cw-tile-cta svg { transform: translateX(2px); }

/* Loading skeleton */
.cw-skel { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 18px; }
.cw-skel-line { height: 12px; border-radius: 6px; background: var(--bg-gray); margin-bottom: 8px; animation: cw-pulse 1.4s ease-in-out infinite; }
.cw-skel-line.cw-w60 { width: 60%; }
.cw-skel-line.cw-w90 { width: 90%; }
.cw-skel-line.cw-w40 { width: 40%; }
@keyframes cw-pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

.cw-empty, .cw-error {
    text-align: center; padding: 40px 16px; color: var(--text-light);
    border: 1px dashed var(--border); border-radius: var(--radius-card); grid-column: 1 / -1;
}
.cw-error p:first-child { font-weight: 700; color: var(--text); margin: 0 0 6px; }
.cw-error p:last-child { margin: 0 0 14px; font-size: 0.9rem; }
.cw-retry {
    background: var(--primary); color: #fff; border: none; border-radius: 999px;
    padding: 9px 18px; font-weight: 700; font-size: 0.85rem; font-family: inherit; cursor: pointer;
}
.cw-retry:hover { filter: brightness(0.94); }
</style>
</head>
<body>

<div class="cw-widget" role="region" aria-label="Menu sub-pages">
    <div class="cw-grid" id="grid"></div>
</div>

<script>
"use strict";
(function () {

/* =====================================================================
   CONFIG

   Deploy target : https://bshrfp.staffbase.rocks/
   Menu API      : https://backstage.staffbase.com/catalog/default/api/menu-api
   Pages API     : api:default/pages-api

   The widget reads the children of a menu node and renders each child
   *page* as a tile (title + teaser + link). Pass the parent menu node id
   on the embed URL as ?menuId=... — grab it from Experience Studio, or
   from GET /api/menu (each node has an `id`).
   ===================================================================== */
var CONFIG = {
    // Fallback parent menu node id if none is passed via ?menuId= on the
    // embed URL. Replace with the real id for bshrfp once you have it, or
    // always pass ?menuId= on the embed URL and leave this empty.
    DEFAULT_MENU_ID: "6a6558052a3610619c580c70",
    DEFAULT_LOCALE: "en_US",
    TEASER_MAX_CHARS: 160,

    // "_top" navigates the whole Staffbase app frame — recommended since
    // this widget is embedded inside a Staffbase page via iframe.
    LINK_TARGET: "_top"
};

function qp(name) { return new URLSearchParams(location.search).get(name); }
var MENU_ID = qp("menuId") || CONFIG.DEFAULT_MENU_ID;
var LOCALE = qp("locale") || CONFIG.DEFAULT_LOCALE;
// ?debug=1 dumps the raw menu child nodes instead of rendering tiles —
// use it to inspect the actual field names for this environment.
var DEBUG = qp("debug") === "1" || qp("debug") === "true";

/* Resolve the Staffbase origin to build API URLs against. When this HTML
   is served same-origin from the Staffbase domain, location.origin is
   correct. But inside a srcdoc / sandboxed iframe the origin is opaque
   ("null"), so we recover the host page origin from ancestorOrigins or the
   referrer. An explicit ?apiBase= override always wins. */
var BASE_ORIGIN = (function () {
    var override = qp("apiBase") || qp("base");
    if (override) return override.replace(/\/+$/, "");
    var origin = location.origin;
    if (origin && origin !== "null" && /^https?:/i.test(origin)) return origin;
    try {
        if (location.ancestorOrigins && location.ancestorOrigins.length) {
            return location.ancestorOrigins[location.ancestorOrigins.length - 1];
        }
    } catch (e) { /* not supported, fall through */ }
    if (document.referrer) {
        try { return new URL(document.referrer).origin; } catch (e) { /* ignore */ }
    }
    return "";
})();

/* =====================================================================
   STAFFBASE BRAND COLOR PASSTHROUGH
   ===================================================================== */
function applySBBrand() {
    var sb = getComputedStyle(document.documentElement).getPropertyValue("--sb-brand").trim();
    if (sb) { document.documentElement.style.setProperty("--primary", sb); return; }
    try {
        sb = window.parent.getComputedStyle(window.parent.document.documentElement).getPropertyValue("--sb-brand").trim();
        if (sb) document.documentElement.style.setProperty("--primary", sb);
    } catch (e) { /* not same-origin in this context, ignore */ }
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function escapeHTML(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
}
function truncate(str, max) {
    if (!str) return "";
    var s = String(str).trim();
    if (s.length <= max) return s;
    return s.slice(0, max).replace(/\s+\S*$/, "") + "…";
}
// Pick the requested locale from a locale-keyed map, falling back to the
// first available locale. Used for menu-node localization, page contents,
// and content documents — all of which are keyed by locale (e.g. "en_US").
function pickLocale(map, locale) {
    if (!map || typeof map !== "object") return null;
    if (locale && map[locale]) return map[locale];
    var keys = Object.keys(map);
    return keys.length ? map[keys[0]] : null;
}
// Strip HTML down to plain text (classic pages store body HTML in `contents`).
function htmlToText(html) {
    if (!html) return "";
    var tmp = document.createElement("div");
    tmp.innerHTML = html;
    return (tmp.textContent || tmp.innerText || "").replace(/\s+/g, " ").trim();
}

var ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

/* =====================================================================
   STAFFBASE API CALLS — direct, same-origin. The universal embed widget
   serves this iframe from the Staffbase domain itself, so the logged-in
   user's session cookie is sent automatically.
   ===================================================================== */
function sbFetch(path, params) {
    if (!BASE_ORIGIN) return Promise.reject(new Error("Could not resolve the Staffbase origin. Add ?apiBase=https://bshrfp.staffbase.rocks to the widget URL."));
    var url = new URL(path, BASE_ORIGIN);
    Object.keys(params || {}).forEach(function (k) {
        if (params[k] !== undefined && params[k] !== null) url.searchParams.set(k, params[k]);
    });
    return fetch(url, { credentials: "include", headers: { Accept: "application/json" } }).then(function (res) {
        if (!res.ok) throw new Error("Request failed (" + res.status + ") for " + path);
        return res.json();
    });
}

/* ---------------------------------------------------------------------
   MENU — per the Menu API, a menu node is a tree where each node carries
   its children under `children.data`. GET /api/menu/accessible/{id}
   returns a specific node (permission-filtered for the current user)
   including its subtree; GET /api/menu returns the whole accessible tree.
   We read children from `node.children.data`.
   --------------------------------------------------------------------- */
// Children may come back in a few shapes depending on the endpoint/version:
// node.children.data (documented), node.children (bare array), node.items,
// or node.data. Accept whichever is an array.
function extractChildren(node) {
    if (!node) return null;
    var c = node.children;
    if (Array.isArray(c)) return c;
    if (c && Array.isArray(c.data)) return c.data;
    if (Array.isArray(node.items)) return node.items;
    if (Array.isArray(node.data)) return node.data;
    return null;
}

function getMenuChildren(menuId) {
    // Primary: fetch just the target node (accessible = filtered to what
    // the current user may see).
    return sbFetch("/api/menu/accessible/" + encodeURIComponent(menuId))
        .then(function (node) {
            var kids = extractChildren(node);
            return kids || findChildrenInTree(menuId);
        })
        .catch(function () {
            // Fallback: walk the full accessible tree and locate the node.
            return findChildrenInTree(menuId);
        });
}

function findChildrenInTree(menuId) {
    return sbFetch("/api/menu").then(function (tree) {
        var found = null;
        (function walk(node) {
            if (!node || found) return;
            if (node.id === menuId) { found = node; return; }
            var kids = extractChildren(node) || [];
            for (var i = 0; i < kids.length; i++) walk(kids[i]);
        })(tree);
        return extractChildren(found) || [];
    });
}

// The Pages API id lives on the node under one of these field names.
function nodeInstallationId(node) {
    return (node && (node.installationID || node.installationId || node.contentID || node.contentId)) || null;
}
// Is this menu child a page-like content node? Historically the pages
// plugin id has been "page" or "pages" — accept either.
function looksLikePage(node) {
    return /^pages?$/i.test((node && node.pluginID) || "");
}
// A renderable child tile: any content/link node that isn't a plain folder.
// We keep anything with a content installation, a prebuilt link target, or a
// plugin id — folders (organizational only) are skipped.
function isContentNode(node) {
    if (!node || node.nodeType === "folder") return false;
    return !!nodeInstallationId(node) || !!(node.target && node.target.url) || !!node.pluginID;
}

// Title from the menu node localization (always present, no extra fetch),
// with fallbacks for alternate shapes.
function getNodeTitle(node, locale) {
    var picked = pickLocale(node && node.config && node.config.localization, locale);
    if (picked && picked.title) return picked.title;
    var picked2 = pickLocale(node && node.localization, locale);
    if (picked2 && picked2.title) return picked2.title;
    return (node && (node.title || node.name)) || null;
}

// In-app URL: Staffbase pre-builds `target.url` on the node with the
// correct id and routing; strip the `/openlink` deep-link prefix for
// in-app navigation. Fallback mirrors the frontend routing pattern using
// the *menu node id*.
function buildPageUrl(node) {
    if (node.target && node.target.url) {
        return BASE_ORIGIN + String(node.target.url).replace(/^\/openlink/, "");
    }
    if (node.pluginID) return BASE_ORIGIN + "/content/" + node.pluginID + "/" + node.id;
    return BASE_ORIGIN + "/content/menu/" + node.id;
}

/* ---------------------------------------------------------------------
   PAGES — GET /api/pages/{installationID}. Modern (Content Designer)
   pages expose their block document under contentDocuments.{locale};
   classic pages keep body HTML under contents.{locale}.content. Title
   also lives on contents.{locale}.title.
   --------------------------------------------------------------------- */
function getPage(installationId) {
    return sbFetch("/api/pages/" + encodeURIComponent(installationId));
}
function getContentDocument(page, locale) {
    return pickLocale(page && page.contentDocuments, locale);
}
function getPageTitle(page, locale) {
    var c = pickLocale(page && page.contents, locale);
    return (c && c.title) || null;
}
function getClassicHTML(page, locale) {
    var c = pickLocale(page && page.contents, locale);
    return (c && c.content) || "";
}

/* =====================================================================
   CONTENT DOCUMENT PARSING
   Per the Staffbase Content Document Format:
     { blocks: { <id>: { type, config, children? } }, content: [<rootId>, ...] }
   Text lives on `type: "text"` blocks as config.value; wrapper blocks
   (paragraph, list item, ...) reference child block ids via `children`.
   ===================================================================== */
function collectText(doc, blockId) {
    var block = doc.blocks && doc.blocks[blockId];
    if (!block) return "";
    if (block.type === "text") return (block.config && block.config.value) || "";
    if (Array.isArray(block.children)) {
        return block.children.map(function (id) { return collectText(doc, id); }).join("");
    }
    return "";
}

// First non-empty text container at the root level, skipping heading
// blocks — the page title lives on the page resource, but authors
// sometimes add a heading block too, so skip it and get real body copy.
function extractTeaser(doc) {
    if (!doc || !Array.isArray(doc.content)) return "";
    for (var i = 0; i < doc.content.length; i++) {
        var rootId = doc.content[i];
        var block = doc.blocks && doc.blocks[rootId];
        if (!block || block.type === "heading") continue;
        var text = collectText(doc, rootId).trim();
        if (text) return text;
    }
    return "";
}

// Teaser for either page flavour: modern content document, else classic HTML.
function teaserForPage(page, locale) {
    var doc = getContentDocument(page, locale);
    if (doc) {
        var fromDoc = extractTeaser(doc);
        if (fromDoc) return fromDoc;
    }
    return htmlToText(getClassicHTML(page, locale));
}

/* =====================================================================
   IN-MEMORY CACHE (60s) — avoids refetching on re-render within a session
   ===================================================================== */
var cache = {};
var CACHE_TTL_MS = 60000;
function getCached(key) {
    var entry = cache[key];
    if (!entry || Date.now() - entry.time > CACHE_TTL_MS) return null;
    return entry.value;
}
function setCached(key, value) { cache[key] = { value: value, time: Date.now() }; }

function fetchSubPages(menuId, locale) {
    var cacheKey = menuId + ":" + locale;
    var cached = getCached(cacheKey);
    if (cached) return Promise.resolve(cached);

    return getMenuChildren(menuId).then(function (children) {
        var contentNodes = (children || []).filter(isContentNode);
        return Promise.all(contentNodes.map(function (node) {
            var nodeTile = {
                title: getNodeTitle(node, locale) || "Untitled",
                teaser: "",
                url: buildPageUrl(node)
            };
            var instId = nodeInstallationId(node);
            // Only fetch page bodies for page-like nodes — other content
            // (news, forms, links, …) just renders from the menu node.
            if (!instId || !looksLikePage(node)) return Promise.resolve(nodeTile);
            return getPage(instId).then(function (page) {
                return {
                    title: getNodeTitle(node, locale) || getPageTitle(page, locale) || "Untitled",
                    teaser: teaserForPage(page, locale),
                    url: buildPageUrl(node)
                };
            }).catch(function (err) {
                // Page body failed — still show a tile from the menu node alone.
                console.error("[menu-subpages-widget] failed to load page " + instId, err);
                return nodeTile;
            });
        }));
    }).then(function (pages) {
        var result = pages.filter(Boolean);
        setCached(cacheKey, result);
        return result;
    });
}

/* =====================================================================
   RENDER
   ===================================================================== */
function tileHTML(page) {
    var teaser = truncate(page.teaser, CONFIG.TEASER_MAX_CHARS);
    return (
        '<a class="cw-tile" href="' + escapeHTML(page.url || "#") + '" target="' + CONFIG.LINK_TARGET + '" rel="noopener">' +
            '<h3 class="cw-tile-title">' + escapeHTML(page.title) + "</h3>" +
            (teaser ? '<p class="cw-tile-teaser">' + escapeHTML(teaser) + "</p>" : "") +
            '<span class="cw-tile-cta">Read more ' + ICON_ARROW + "</span>" +
        "</a>"
    );
}

function renderLoading() {
    var grid = document.getElementById("grid");
    var skeleton = "";
    for (var i = 0; i < 4; i++) {
        skeleton +=
            '<div class="cw-skel">' +
                '<div class="cw-skel-line cw-w60"></div>' +
                '<div class="cw-skel-line cw-w90"></div>' +
                '<div class="cw-skel-line cw-w90"></div>' +
                '<div class="cw-skel-line cw-w40"></div>' +
            "</div>";
    }
    grid.innerHTML = skeleton;
}
function renderEmpty() {
    document.getElementById("grid").innerHTML = '<div class="cw-empty"><p>No pages found in this menu.</p></div>';
}
function renderMissingMenuId() {
    document.getElementById("grid").innerHTML =
        '<div class="cw-error">' +
            "<p>No menu selected.</p>" +
            "<p>Add <code>?menuId=&lt;parent menu node id&gt;</code> to the widget URL.</p>" +
        "</div>";
}
function renderError() {
    document.getElementById("grid").innerHTML =
        '<div class="cw-error">' +
            "<p>Couldn't load these pages.</p>" +
            "<p>Please try again in a moment.</p>" +
            '<button type="button" class="cw-retry" id="retryBtn">Retry</button>' +
        "</div>";
    var btn = document.getElementById("retryBtn");
    if (btn) btn.addEventListener("click", load);
}
function render(pages) {
    document.getElementById("grid").innerHTML = pages.map(tileHTML).join("");
}
function renderDebug(children) {
    var json = JSON.stringify(children, null, 2);
    document.getElementById("grid").innerHTML =
        '<pre style="grid-column:1/-1;white-space:pre-wrap;word-break:break-word;' +
        'font-size:11px;line-height:1.45;background:var(--bg-gray);color:var(--text);' +
        'padding:14px;border-radius:10px;border:1px solid var(--border);overflow:auto;max-height:75vh;">' +
        escapeHTML(json) + "</pre>";
}

/* =====================================================================
   INIT
   ===================================================================== */
function load() {
    if (!MENU_ID) { renderMissingMenuId(); return; }
    renderLoading();
    if (DEBUG) {
        getMenuChildren(MENU_ID).then(function (children) {
            console.log("[menu-subpages-widget] raw children:", children);
            renderDebug(children || []);
        }).catch(function (err) {
            console.error("[menu-subpages-widget]", err);
            renderError();
        });
        return;
    }
    fetchSubPages(MENU_ID, LOCALE).then(function (pages) {
        if (!pages.length) renderEmpty(); else render(pages);
    }).catch(function (err) {
        console.error("[menu-subpages-widget]", err);
        renderError();
    });
}

function init() {
    applySBBrand();
    load();
}

document.addEventListener("DOMContentLoaded", init);

})();

</script>

</body>
</html>
